name: Build and API compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain --no-daemon

      - name: Check binary compatibility against 0.2.0-alpha.8 (stable baseline)
        run: |
          NEW_JAR=$(find build/libs -maxdepth 1 -name 'quill-ui-*.jar' ! -name '*-sources.jar' | head -n 1)
          curl -fsSL -o /tmp/quill-baseline.jar \
            https://github.com/NetoTTT/quill-ui/releases/download/v0.2.0-alpha.8/quill-ui-0.2.0-alpha.8.jar
          curl -fsSL -o /tmp/japicmp.jar \
            https://repo1.maven.org/maven2/com/github/siom79/japicmp/japicmp/0.23.1/japicmp-0.23.1-jar-with-dependencies.jar
          java -jar /tmp/japicmp.jar \
            --old /tmp/quill-baseline.jar \
            --new "$NEW_JAR" \
            --only-incompatible \
            --ignore-missing-classes \
            --exclude com.quillui.theme.QuillTheme \
            --error-on-binary-incompatibility
